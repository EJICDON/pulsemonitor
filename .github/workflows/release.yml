name: Build & Release Linux Packages

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-packages:
    name: Build Ubuntu .deb & Portable Tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check & build Linux packages
        run: |
          python3 -m py_compile app.py linux/build_linux_packages.py
          python3 linux/build_linux_packages.py
          ls -lh dist/

      - name: Verify Debian package structure
        run: |
          dpkg-deb --info dist/pulsemonitor_*_all.deb
          dpkg-deb --contents dist/pulsemonitor_*_all.deb

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulsemonitor-linux-packages
          path: |
            dist/*.deb
            dist/*.tar.gz

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.tar.gz
